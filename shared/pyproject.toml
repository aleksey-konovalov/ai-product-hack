[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-utils"
version = "0.1.0"

[tool.setuptools]
packages = ["shared"]

[tool.setuptools.package-dir]
"shared" = "."

[tool.ruff]
# Общая конфигурация линтера — в ruff.toml в корне репозитория
# (этот pyproject иначе перекрывает её для файлов внутри shared/).
extend = "../ruff.toml"

