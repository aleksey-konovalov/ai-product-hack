# Ruff — линтер Python-кода репозитория.
# Запуск: make lint (в docker, локальные зависимости не нужны).
# CI: job lint в .github/workflows/ci.yml (версия ruff пинится там же).
target-version = "py311"   # floor всех python-сервисов (образы python:3.11-slim)

[lint]
# E4/E7/E9 — ошибки pycodestyle, F — pyflakes, I — порядок импортов,
# UP — устаревший синтаксис, B — вероятные баги, SIM — упрощения, RUF — правила ruff.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001/RUF002/RUF003 («неоднозначные» unicode-символы) — сотни ложных
# срабатываний на кириллице: комментарии и тексты в репозитории намеренно на русском.
ignore = ["RUF001", "RUF002", "RUF003"]

[lint.per-file-ignores]
# setup_logging() вызывается между импортами: модули, импортируемые ниже,
# должны логировать уже через общую настройку — порядок намеренный.
"services/agent/src/app.py" = ["E402"]
