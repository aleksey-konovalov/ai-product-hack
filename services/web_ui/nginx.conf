# web_ui: статика фронта + reverse proxy на agent (тот же origin, CORS не нужен).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Один файл фронта обновляется часто — кэш не держим
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # LLM отвечает десятки секунд — таймаут с запасом
    location /chat {
        proxy_pass http://agent:8130;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # сквозной request_id: agent кладёт его в каждую строку лога запроса
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Health web_ui проверяет связку целиком: nginx → agent
    location /health {
        proxy_pass http://agent:8130;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 10s;
    }
}
